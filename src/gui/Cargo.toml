[package]
name = "mwp-gui"
version = "0.1.5"
edition = "2021"
rust-version = "1.95"
description = "Desktop editor for MWP (Module Work Plan): the mwp/ files, the task board, agents and lint."
license = "Apache-2.0"

[[bin]]
name = "mwp-gui"
path = "src/main.rs"

[dependencies]
# The core does all the work; the GUI only shows it.
mwp = { path = "../client" }
# persistence: eframe keeps the window size and place, panel sizes and collapsed sections.
eframe = { version = "0.37", features = ["persistence"] }
rfd = "0.17.2"
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
# Icon font (Material Symbols, outlined); egui's own fonts have few icons.
egui_material_icons = { version = "0.9", default-features = false, features = ["outline"] }
# Language files (lang/*.json) are edited by hand: a real JSON parser gives clear errors.
serde_json = "1"

[build-dependencies]
# Embeds assets/icone/icon.ico in the Windows exe (build.rs).
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
